name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      # Restore & Build
      - name: Restore dependencies
        run: dotnet restore ./StarterApp.Database/StarterApp.Database.csproj

      - name: Build database project
        run: dotnet build ./StarterApp.Database/StarterApp.Database.csproj --configuration Release --no-restore

      # Run xUnit Tests + Coverage
      - name: Run tests with coverage
        run: dotnet test ./StarterApp.Tests/StarterApp.Tests.csproj --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      # Upload test results
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: StarterApp.Tests/TestResults/**

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"StarterApp.Tests/TestResults/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;MarkdownSummaryGithub"

      - name: Show coverage summary in GitHub
        run: cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: coverage-report
          if-no-files-found: error

      # Upload coverage to Codecov
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          directory: ./StarterApp.Tests/TestResults
          fail_ci_if_error: true

      # Install Doxygen
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      # Generate Doxygen config
      - name: Generate Doxygen config
        run: |
          doxygen -g Doxyfile
          sed -i 's|OUTPUT_DIRECTORY.*|OUTPUT_DIRECTORY = docs|' Doxyfile
          sed -i 's|INPUT.*|INPUT = StarterApp StarterApp.Database|' Doxyfile
          sed -i 's|RECURSIVE.*|RECURSIVE = YES|' Doxyfile
          sed -i 's|GENERATE_HTML.*|GENERATE_HTML = YES|' Doxyfile
          sed -i 's|GENERATE_LATEX.*|GENERATE_LATEX = NO|' Doxyfile
          sed -i 's|EXTRACT_ALL.*|EXTRACT_ALL = YES|' Doxyfile

      # Run Doxygen
      - name: Run Doxygen
        run: doxygen Doxyfile

      # Upload Doxygen HTML (REQUIRED EVIDENCE)
      - name: Upload Doxygen HTML
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-docs
          path: docs/html
          if-no-files-found: error
      